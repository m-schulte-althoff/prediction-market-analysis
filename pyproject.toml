[project]
name = "prediction-market-analysis"
version = "0.2.0"
description = "How platform resolution architectures constitute prediction-market claims"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.1",
    "pandas>=2.2",
    "requests>=2.32",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "statsmodels>=0.14",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-requests>=2.32",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/reporting.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
packages = ["src"]

[[tool.mypy.overrides]]
module = ["scipy.*", "sklearn.*", "statsmodels.*"]
ignore_missing_imports = true
